<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pocket Roo</title>
  </head>
  <body>
    <header id="titlebar">
      <span class="title">POCKET ROO</span>
      <div class="controls">
        <button id="btn-pin" class="active" type="button" tabindex="-1" title="Always on top">PIN</button>
        <button id="btn-pause" type="button" tabindex="-1" title="Pause (Esc)">II</button>
        <button id="btn-min" type="button" tabindex="-1" title="Minimize">_</button>
        <button id="btn-close" type="button" tabindex="-1" title="Quit">X</button>
      </div>
    </header>
    <main id="stage">
      <canvas id="game"></canvas>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
